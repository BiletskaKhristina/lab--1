<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <title>Запропонувати місто</title>
</head>

<body>
    <header>
        <h1>Запропонувати місто для наступного рейтингу</h1>
        <nav>
            <a href="index.html">Головна</a> |
            <a href="city-paris.html">Париж</a> |
            <a href="city-tokyo.html">Токіо</a> |
            <a href="city-rome.html">Рим</a> |
            <a href="form.html">Запропонувати місто</a>
        </nav>
    </header>
    <main>
        <form>
            <div>
                <label for="name">Ваше ім'я: </label>
                <input type="text" id="name" name="name" required>
            </div>
            <br>
            <div>
                <label for="email">Email: </label>
                <input type="email" id="email" name="email" required>
            </div>
            <br>
            <div>
                <label for="city">Назва міста: </label>
                <input type="text" id="city" name="city" required>
            </div>
            <br>
            <div>
                <label for="continent">Континент: </label>
                <select id="continent" name="continent">
                    <option value="europe">Європа</option>
                    <option value="asia">Азія</option>
                    <option value="americas">Америка</option>
                </select>
            </div>
            <br>
            <div>
                <label for="reason">Чому варто відвідати?: </label><br>
                <textarea id="reason" name="reason" rows="4" cols="30" required></textarea>
            </div>
            <br>
            <button type="submit">Надіслати</button>
        </form>
    </main>
    <footer>
        <p><a href="index.html">Повернутися на головну</a></p>
    </footer>
</body>

</html>
